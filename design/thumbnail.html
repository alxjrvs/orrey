<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;width:1280px;height:854px;overflow:hidden}
.wrap{display:grid;grid-template-columns:1fr 200px;width:1280px;height:854px}
.main{background:#313338;display:grid;place-items:center;padding:0 60px}
.mark{font:700 96px/1.05 var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--slate-100);text-align:center;white-space:nowrap}
.mark b{color:var(--signal-500)}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}
.strip i{display:block}
</style></head><body>
<div class="wrap">
<div class="main"><div class="mark">Orrey<b>·</b></div></div>
<div class="strip">
<i style="background:#f5c463"></i>
<i style="background:#7983f5"></i>
<i style="background:#5865f2"></i>
<i style="background:#23a559"></i>
</div>
</div></body></html>
