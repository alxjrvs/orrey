<!-- @dsCard group="Colors" viewport="700x130" name="Ink" subtitle="Three text weights. Nothing dimmer than --text-muted carries meaning." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-page);font:var(--type-body)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1;min-width:0}
.chip{height:44px;border:1px solid var(--line-hair)}
.n{display:block;font:var(--type-micro);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{display:block;font:var(--type-log);line-height:1.4;color:var(--slate-500)}
</style></head><body><div class="row">
<div class="sw"><div class="chip" style="height:44px;background:var(--text-primary)"></div><b class="n">Primary</b><span class="v">--slate-100 · #f2f3f5</span></div>
<div class="sw"><div class="chip" style="height:44px;background:var(--text-secondary)"></div><b class="n">Secondary</b><span class="v">--slate-400 · #b5bac1</span></div>
<div class="sw"><div class="chip" style="height:44px;background:var(--text-muted)"></div><b class="n">Muted</b><span class="v">--slate-500 · #949ba4</span></div>
<div class="sw"><div class="chip" style="height:44px;background:var(--text-inverse)"></div><b class="n">Inverse (on accent)</b><span class="v">#ffffff</span></div>
</div></body></html>
