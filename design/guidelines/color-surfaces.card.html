<!-- @dsCard group="Colors" viewport="700x130" name="Surfaces" subtitle="Five near-black slates. Page, chrome, raised, inset, sunken." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-page);font:var(--type-body)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1;min-width:0}
.chip{height:44px;border:1px solid var(--line-hair)}
.n{display:block;font:var(--type-micro);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{display:block;font:var(--type-log);line-height:1.4;color:var(--slate-500)}
</style></head><body><div class="row">
<div class="sw"><div class="chip" style="height:44px;background:var(--surface-page)"></div><b class="n">Page</b><span class="v">--slate-900 · #313338</span></div>
<div class="sw"><div class="chip" style="height:44px;background:var(--surface-chrome)"></div><b class="n">Chrome</b><span class="v">--slate-950 · #2b2d31</span></div>
<div class="sw"><div class="chip" style="height:44px;background:var(--surface-raised)"></div><b class="n">Raised / hover</b><span class="v">--slate-850 · #3a3d44</span></div>
<div class="sw"><div class="chip" style="height:44px;background:var(--surface-inset)"></div><b class="n">Inset</b><span class="v">--slate-800 · #383a40</span></div>
<div class="sw"><div class="chip" style="height:44px;background:var(--surface-sunken)"></div><b class="n">Sunken / input</b><span class="v">--slate-1000 · #1e1f22</span></div>
</div></body></html>
