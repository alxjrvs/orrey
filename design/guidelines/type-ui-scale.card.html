<!-- @dsCard group="Type" viewport="700x230" name="UI scale" subtitle="Space Grotesk. Body is 13px — the console runs small on purpose." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-page);font:var(--type-body)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1;min-width:0}
.chip{height:44px;border:1px solid var(--line-hair)}
.n{display:block;font:var(--type-micro);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{display:block;font:var(--type-log);line-height:1.4;color:var(--slate-500)}
</style></head><body><div style="display:grid;gap:10px">
<div><span style="font:var(--type-display)">Next 14 days</span><span class="v">--type-display · 26/1.2 · 700</span></div>
<div><span style="font:var(--type-title)">Age of Umbra</span><span class="v">--type-title · 17/1.2 · 700</span></div>
<div><span style="font:var(--type-heading)">Session 14</span><span class="v">--type-heading · 15/1.35 · 700</span></div>
<div><span style="font:var(--type-body)">Four in, one out, one silent. Quorum is met.</span><span class="v">--type-body · 13/1.5 · 400</span></div>
<div><span style="font:var(--type-small)">Signups close Friday 18:00.</span><span class="v">--type-small · 12/1.5 · 400</span></div>
</div></body></html>
