<!-- @dsCard group="Type" viewport="700x150" name="Pairing in use" subtitle="Prose in Space Grotesk, every number and id in mono. No exceptions." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-page);font:var(--type-body)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1;min-width:0}
.chip{height:44px;border:1px solid var(--line-hair)}
.n{display:block;font:var(--type-micro);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{display:block;font:var(--type-log);line-height:1.4;color:var(--slate-500)}
</style></head><body><div style="border-top:1px solid var(--line-structural)">
<div style="display:grid;grid-template-columns:80px 1fr 120px;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-hair);align-items:center">
<span style="font:var(--type-data)">THU 02<br><span style="color:var(--text-muted);font-weight:400">19:30</span></span>
<span><b style="font:var(--type-body-medium)">Age of Umbra · S14</b><br><span style="font:var(--type-log);color:var(--text-muted)">the gate under callow hill</span></span>
<span style="font:var(--type-data);color:var(--text-secondary)">4/6 · quorum met</span>
</div></div>
<p style="font:var(--type-small);color:var(--text-muted);margin:12px 0 0">Session subtitles are lower-case mono: they are data the GM typed, not prose Orrey wrote.</p></body></html>
