<!-- @dsCard group="Spacing" viewport="700x170" name="Chrome dimensions" subtitle="Fixed: 44 top, 210 rail, 300 detail, 26 status." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-page);font:var(--type-body)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1;min-width:0}
.chip{height:44px;border:1px solid var(--line-hair)}
.n{display:block;font:var(--type-micro);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{display:block;font:var(--type-log);line-height:1.4;color:var(--slate-500)}
</style></head><body><div style="display:grid;grid-template-rows:44px 1fr 26px;height:130px;border:1px solid var(--line-structural)">
<div style="background:var(--surface-chrome);border-bottom:1px solid var(--line-structural);display:flex;align-items:center;padding:0 12px;font:var(--type-micro);letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)">Top bar 44px</div>
<div style="display:grid;grid-template-columns:210px 1fr 300px;min-height:0">
<div style="border-right:1px solid var(--line-structural);background:var(--surface-chrome);display:grid;place-items:center;font:var(--type-micro);letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)">Rail 210</div>
<div style="display:grid;place-items:center;font:var(--type-micro);letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)">Agenda · 18px gutter</div>
<div style="border-left:1px solid var(--line-structural);background:var(--surface-chrome);display:grid;place-items:center;font:var(--type-micro);letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)">Detail 300</div>
</div>
<div style="background:var(--surface-chrome);border-top:1px solid var(--line-structural);display:flex;align-items:center;padding:0 12px;font:var(--type-micro);letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)">Status 26px</div>
</div></body></html>
