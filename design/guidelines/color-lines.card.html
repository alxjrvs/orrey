<!-- @dsCard group="Colors" viewport="700x150" name="Lines" subtitle="Two weights of hairline do all the dividing. There are no shadows." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-page);font:var(--type-body)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1;min-width:0}
.chip{height:44px;border:1px solid var(--line-hair)}
.n{display:block;font:var(--type-micro);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{display:block;font:var(--type-log);line-height:1.4;color:var(--slate-500)}
</style></head><body><div style="display:grid;gap:0">
<div style="padding:12px 0;border-bottom:1px solid var(--line-structural)"><b class="n" style="margin:0">Structural · --slate-750 · #3f4147</b><span class="v">Panels, chrome edges, table head</span></div>
<div style="padding:12px 0;border-bottom:1px solid var(--line-hair)"><b class="n" style="margin:0">Hair · --slate-800 · #383a40</b><span class="v">Between rows in a list</span></div>
<div style="padding:12px 0;border-bottom:1px solid var(--line-strong)"><b class="n" style="margin:0">Strong · --slate-700 · #4e5058</b><span class="v">Control outlines, checkbox edges</span></div>
</div></body></html>
