<!-- @dsCard group="Brand" viewport="700x140" name="Control states" subtitle="Hover lightens, press darkens, disabled drops to 40%." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-page);font:var(--type-body)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1;min-width:0}
.chip{height:44px;border:1px solid var(--line-hair)}
.n{display:block;font:var(--type-micro);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{display:block;font:var(--type-log);line-height:1.4;color:var(--slate-500)}
</style></head><body><div class="row" style="gap:12px;align-items:flex-start">
<div><button style="height:32px;padding:0 12px;border:0;background:var(--signal-500);color:var(--action-ink);font:var(--type-label);letter-spacing:.09em;text-transform:uppercase">+ Session</button><b class="n">Rest</b></div><div><button style="height:32px;padding:0 12px;border:0;background:var(--signal-400);color:var(--action-ink);font:var(--type-label);letter-spacing:.09em;text-transform:uppercase">+ Session</button><b class="n">Hover</b></div><div><button style="height:32px;padding:0 12px;border:0;background:var(--signal-600);color:var(--action-ink);font:var(--type-label);letter-spacing:.09em;text-transform:uppercase">+ Session</button><b class="n">Press</b></div>
<div><button style="height:32px;padding:0 12px;border:0;background:var(--signal-500);color:var(--action-ink);font:var(--type-label);letter-spacing:.09em;text-transform:uppercase;opacity:.4">+ Session</button><b class="n">Disabled</b></div>
<div style="margin-left:18px"><button style="height:32px;padding:0 12px;background:transparent;border:1px solid var(--line-structural);color:var(--text-primary);font:var(--type-label);letter-spacing:.08em;text-transform:uppercase">Nudge 1</button><b class="n">Secondary rest</b></div>
<div><button style="height:32px;padding:0 12px;background:var(--surface-raised);border:1px solid var(--line-strong);color:var(--text-primary);font:var(--type-label);letter-spacing:.08em;text-transform:uppercase">Nudge 1</button><b class="n">Secondary hover</b></div>
</div></body></html>
