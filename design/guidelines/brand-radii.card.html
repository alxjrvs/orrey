<!-- @dsCard group="Brand" viewport="700x150" name="Corner radii" subtitle="Square by default. Only pills, avatars and Discord chrome round." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-page);font:var(--type-body)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1;min-width:0}
.chip{height:44px;border:1px solid var(--line-hair)}
.n{display:block;font:var(--type-micro);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{display:block;font:var(--type-log);line-height:1.4;color:var(--slate-500)}
</style></head><body><div class="row" style="gap:18px;align-items:flex-end">
<div><div style="width:72px;height:48px;border:1px solid var(--line-strong);border-radius:0"></div><b class="n">0 · everything</b></div>
<div><div style="width:72px;height:48px;border:1px solid var(--line-strong);border-radius:2px"></div><b class="n">2 · sm, rare</b></div>
<div><div style="width:110px;height:26px;border:1px solid var(--state-in-line);background:var(--state-in-bg);border-radius:99px"></div><b class="n">99 · pills only</b></div>
<div><div style="width:32px;height:32px;border-radius:50%;background:var(--slate-850);border:1px solid var(--line-structural)"></div><b class="n">50% · discord avatars</b></div>
<div><div style="width:72px;height:48px;background:var(--discord-embed);border-radius:8px"></div><b class="n">8 · discord embeds</b></div>
</div></body></html>
