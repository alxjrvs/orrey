<!-- @dsCard group="Colors" viewport="700x130" name="Discord palette" subtitle="Discord's own colours. Used only inside bot-post mockups." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-page);font:var(--type-body)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1;min-width:0}
.chip{height:44px;border:1px solid var(--line-hair)}
.n{display:block;font:var(--type-micro);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{display:block;font:var(--type-log);line-height:1.4;color:var(--slate-500)}
</style></head><body><div class="row">
<div class="sw"><div class="chip" style="height:44px;background:var(--discord-bg)"></div><b class="n">Chat bg</b><span class="v">#313338</span></div>
<div class="sw"><div class="chip" style="height:44px;background:var(--discord-embed)"></div><b class="n">Embed</b><span class="v">#2b2d31</span></div>
<div class="sw"><div class="chip" style="height:44px;background:var(--discord-blurple)"></div><b class="n">Primary</b><span class="v">#5865f2</span></div>
<div class="sw"><div class="chip" style="height:44px;background:var(--discord-green)"></div><b class="n">Success</b><span class="v">#248046</span></div>
<div class="sw"><div class="chip" style="height:44px;background:var(--discord-red)"></div><b class="n">Danger</b><span class="v">#da373c</span></div>
<div class="sw"><div class="chip" style="height:44px;background:var(--discord-grey-btn)"></div><b class="n">Secondary</b><span class="v">#4e5058</span></div>
</div></body></html>
