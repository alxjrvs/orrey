<!-- @dsCard group="Colors" viewport="700x160" name="Intent states" subtitle="In, maybe, out, silent — the four answers the product collects." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-page);font:var(--type-body)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1;min-width:0}
.chip{height:44px;border:1px solid var(--line-hair)}
.n{display:block;font:var(--type-micro);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{display:block;font:var(--type-log);line-height:1.4;color:var(--slate-500)}
</style></head><body><div class="row" style="align-items:flex-start">
<div class="sw"><div class="chip" style="height:40px;background:var(--state-in)"></div><b class="n">In</b><span class="v">--green-500 · #23a559</span></div>
<div class="sw"><div class="chip" style="height:40px;background:var(--state-maybe)"></div><b class="n">Maybe</b><span class="v">--amber-500 · #f0b232</span></div>
<div class="sw"><div class="chip" style="height:40px;background:var(--state-out)"></div><b class="n">Out</b><span class="v">--rust-500 · #f23f43</span></div>
<div class="sw"><div class="chip" style="height:40px;background:var(--state-silent-bg)"></div><b class="n">No reply</b><span class="v">--slate-800</span></div>
</div>
<div class="row" style="margin-top:14px;gap:8px">
<span style="font:var(--type-micro);letter-spacing:.12em;text-transform:uppercase;padding:5px 9px;border-radius:var(--radius-pill);border:1px solid var(--state-in-line);background:var(--state-in-bg);color:var(--state-in-text)">Confirmed</span>
<span style="font:var(--type-micro);letter-spacing:.12em;text-transform:uppercase;padding:5px 9px;border-radius:var(--radius-pill);border:1px solid var(--state-maybe-line);background:var(--state-maybe-bg);color:var(--state-maybe-text)">Quorum short</span>
<span style="font:var(--type-micro);letter-spacing:.12em;text-transform:uppercase;padding:5px 9px;border-radius:var(--radius-pill);border:1px solid var(--state-out-line);background:var(--state-out-bg);color:var(--state-out-text)">Cancelled</span>
<span style="font:var(--type-micro);letter-spacing:.12em;text-transform:uppercase;padding:5px 9px;border-radius:var(--radius-pill);border:1px solid var(--line-hair);color:var(--text-muted)">Unposted</span>
</div></body></html>
