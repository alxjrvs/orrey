<!-- @dsCard group="Brand" viewport="700x150" name="Motion" subtitle="90–220ms, one easing. Motion confirms a state change; it never introduces one." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-page);font:var(--type-body)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1;min-width:0}
.chip{height:44px;border:1px solid var(--line-hair)}
.n{display:block;font:var(--type-micro);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{display:block;font:var(--type-log);line-height:1.4;color:var(--slate-500)}
</style></head><body><div style="display:grid;gap:10px">
<div style="display:flex;gap:14px;align-items:baseline"><b style="font:var(--type-data);width:60px">90ms</b><span style="font:var(--type-log);color:var(--text-muted);width:130px">--duration-fast</span><span style="font:var(--type-small);color:var(--text-secondary)">Hover and press colour</span></div><div style="display:flex;gap:14px;align-items:baseline"><b style="font:var(--type-data);width:60px">140ms</b><span style="font:var(--type-log);color:var(--text-muted);width:130px">--duration-base</span><span style="font:var(--type-small);color:var(--text-secondary)">Panel and rail content swap</span></div><div style="display:flex;gap:14px;align-items:baseline"><b style="font:var(--type-data);width:60px">220ms</b><span style="font:var(--type-log);color:var(--text-muted);width:130px">--duration-slow</span><span style="font:var(--type-small);color:var(--text-secondary)">Quorum meter filling</span></div>
<p style="font:var(--type-small);color:var(--text-muted);margin:6px 0 0;max-width:64ch">No entrance animations, no spinners on list loads, no bouncing. Easing is <code style="font:var(--type-log);color:var(--text-secondary)">cubic-bezier(.2,0,.2,1)</code> everywhere.</p>
</div></body></html>
