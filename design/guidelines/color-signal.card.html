<!-- @dsCard group="Colors" viewport="700x150" name="Signal" subtitle="One accent. Used for the primary action, selection, and nothing else." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-page);font:var(--type-body)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1;min-width:0}
.chip{height:44px;border:1px solid var(--line-hair)}
.n{display:block;font:var(--type-micro);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{display:block;font:var(--type-log);line-height:1.4;color:var(--slate-500)}
</style></head><body><div class="row" style="align-items:flex-start">
<div class="sw"><div class="chip" style="height:56px;background:var(--signal-500)"></div><b class="n">Signal 500 · action</b><span class="v">#5865f2</span></div>
<div class="sw"><div class="chip" style="height:56px;background:var(--signal-400)"></div><b class="n">Signal 400 · hover</b><span class="v">#7983f5</span></div>
<div class="sw"><div class="chip" style="height:56px;background:var(--signal-600)"></div><b class="n">Signal 600 · press</b><span class="v">#4752c4</span></div>
<div class="sw"><div class="chip" style="height:56px;background:var(--signal-100)"></div><b class="n">Signal 100 · wash</b><span class="v">#3b3f66</span></div>
</div>
<p style="font:var(--type-small);color:var(--text-muted);margin:12px 0 0;max-width:62ch">Never used for decoration, gradients, or hierarchy. If a screen has two blurple things, one of them is wrong.</p></body></html>
