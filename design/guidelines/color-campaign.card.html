<!-- @dsCard group="Colors" viewport="700x130" name="Campaign identity" subtitle="Assigned per campaign at creation. Never reused as UI colour." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-page);font:var(--type-body)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1;min-width:0}
.chip{height:44px;border:1px solid var(--line-hair)}
.n{display:block;font:var(--type-micro);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{display:block;font:var(--type-log);line-height:1.4;color:var(--slate-500)}
</style></head><body><div class="row">
<div class="sw"><div class="chip" style="height:44px;background:var(--campaign-1)"></div><b class="n">Campaign 1</b><span class="v">#eb459e</span></div>
<div class="sw"><div class="chip" style="height:44px;background:var(--campaign-2)"></div><b class="n">Campaign 2</b><span class="v">#3498db</span></div>
<div class="sw"><div class="chip" style="height:44px;background:var(--campaign-3)"></div><b class="n">Campaign 3</b><span class="v">#9b59b6</span></div>
<div class="sw"><div class="chip" style="height:44px;background:var(--campaign-4)"></div><b class="n">Campaign 4</b><span class="v">#1abc9c</span></div>
<div class="sw"><div class="chip" style="height:44px;background:var(--campaign-5)"></div><b class="n">Campaign 5</b><span class="v">#f1c40f</span></div>
<div class="sw"><div class="chip" style="height:44px;background:var(--campaign-idle)"></div><b class="n">Paused / concluded</b><span class="v">#80848e</span></div>
</div></body></html>
