<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-page);font:var(--type-body)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1;min-width:0}
.chip{height:44px;border:1px solid var(--line-hair)}
.n{display:block;font:var(--type-micro);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{display:block;font:var(--type-log);line-height:1.4;color:var(--slate-500)}
</style></head><body><div style="border-top:1px solid var(--line-structural)">
<div style="height:34px;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid var(--line-hair);font:var(--type-small)"><b style="font:var(--type-data);width:60px">34px</b><span style="color:var(--text-secondary)">Dense · sidebar, log, roster</span></div><div style="height:44px;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid var(--line-hair);font:var(--type-small)"><b style="font:var(--type-data);width:60px">44px</b><span style="color:var(--text-secondary)">Default · tables</span></div><div style="height:58px;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid var(--line-hair);font:var(--type-small)"><b style="font:var(--type-data);width:60px">58px</b><span style="color:var(--text-secondary)">Agenda · session rows with a subtitle</span></div>
</div></body></html>
