<!-- @dsCard group="Brand" viewport="700x160" name="Selection & attention" subtitle="An inset bar, never a glow, never a drop shadow." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-page);font:var(--type-body)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1;min-width:0}
.chip{height:44px;border:1px solid var(--line-hair)}
.n{display:block;font:var(--type-micro);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{display:block;font:var(--type-log);line-height:1.4;color:var(--slate-500)}
</style></head><body><div style="border-top:1px solid var(--line-structural)">
<div style="padding:12px;border-bottom:1px solid var(--line-hair);background:var(--surface-raised);box-shadow:var(--marker-selected);font:var(--type-small)">Selected row — <span style="color:var(--text-muted)">inset 2px signal + raised background</span></div>
<div style="padding:12px;border-bottom:1px solid var(--line-hair);box-shadow:var(--marker-attention);font:var(--type-small)">Needs attention — <span style="color:var(--text-muted)">inset 2px amber, background unchanged</span></div>
<div style="padding:12px;border-bottom:1px solid var(--line-hair);background:var(--surface-raised);font:var(--type-small)">Hover — <span style="color:var(--text-muted)">raised background only, 90ms</span></div>
<div style="padding:12px;border-bottom:1px solid var(--line-hair);outline:1px solid var(--focus-ring);outline-offset:-1px;font:var(--type-small)">Focus — <span style="color:var(--text-muted)">1px signal outline, offset 1</span></div>
</div></body></html>
